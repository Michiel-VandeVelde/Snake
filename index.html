<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07120f">
  <title>Neon Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">ARCADE CLASSIC</p>
        <h1>NEON <span>SNAKE</span></h1>
      </div>
      <div class="header-actions">
        <label class="difficulty">
          <span>Speed</span>
          <select id="difficulty" aria-label="Game speed">
            <option value="relaxed">Relaxed</option>
            <option value="classic" selected>Classic</option>
            <option value="turbo">Turbo</option>
          </select>
        </label>
        <button id="soundButton" class="icon-button" type="button" aria-label="Mute sound" aria-pressed="false">♪</button>
      </div>
    </header>

    <section class="scoreboard" aria-label="Game statistics">
      <div><span>Score</span><strong id="score">000</strong></div>
      <div><span>Best</span><strong id="best">000</strong></div>
      <div><span>Level</span><strong id="level">01</strong></div>
    </section>

    <section class="board-wrap">
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <div class="snake-mark" aria-hidden="true">S</div>
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayText">Use arrow keys, WASD, or swipe to move. Every fifth snack spawns a golden bonus.</p>
        <button id="startButton" type="button">Start game</button>
      </div>
    </section>

    <div class="controls" aria-label="Touch controls">
      <button data-direction="up" aria-label="Move up">▲</button>
      <button data-direction="left" aria-label="Move left">◀</button>
      <button data-direction="down" aria-label="Move down">▼</button>
      <button data-direction="right" aria-label="Move right">▶</button>
    </div>
    <p class="hint"><kbd>Space</kbd> pauses · <kbd>R</kbd> restarts</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
